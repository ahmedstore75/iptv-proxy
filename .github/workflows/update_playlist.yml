name: Auto Update Bangla-IPTV Playlist

on:
  schedule:
    # প্রতিদিন রাত ১২টায় (UTC) স্বয়ংক্রিয়ভাবে চলবে (বাংলাদেশ সময় সকাল ৬টা)
    - cron: '0 0 * * *'
  # ম্যানুয়ালি রান করার অপশন
  workflow_dispatch:

permissions:
  contents: write  # Push করার জন্য রাইট পারমিশন নিশ্চিত করবে

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run playlist script
      run: python script.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Bangla/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IPTV playlist [skip ci]" && git push)
