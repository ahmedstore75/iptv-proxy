name: Auto Update Bangla Playlist

on:
  schedule:
    # প্রতিদিন রাত ১২টায় (UTC) স্বয়ংক্রিয়ভাবে চলবে
    - cron: '0 0 * * *'
  # ম্যানুয়ালি রান করার অপশন
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run playlist script
      run: python script.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Bangla/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IPTV playlist" && git push)
