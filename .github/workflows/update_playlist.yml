name: Auto Fetch Channels and Update M3U

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write # অটোমেটিক পুশ পারমিশন নিশ্চিত করার জন্য

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Script
        run: python script.py

      - name: Commit and Push Updated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # তৈরি হওয়া ফাইলগুলো যোগ করা
          git add tv_channels.json playlist.m3u 2>/dev/null || true
          
          # পরিবর্তন থাকলে কমিট ও পুশ করবে
          if git status --porcelain | grep -E 'tv_channels.json|playlist.m3u'; then
            git commit -m "Auto update channels and m3u playlist"
            git push
          else
            echo "No changes to commit"
          fi
